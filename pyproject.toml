[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"


[project]
name = "qsimh"
version = "0.1"
dependencies = [
    "numpy",
    "torch",
    "qiskit",
    "qiskit-experiments"
]

[tool.setuptools.package-dir]
qsimh = "qsimh/"

[tool.setuptools]
include-package-data = true


[tool.setuptools.package-data]
qsimh = ["qsimh/agents/*"]
